services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agentgate"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agentgate:agentgate@db:5432/agentgate
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
